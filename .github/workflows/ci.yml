# Pre-merge gate: typecheck + the real static-export build.
# The deploy/APK/publish workflows only run `npm ci && npm run build` on push, so
# nothing checked a branch before it reached master. Lint reports but does not fail
# (the repo has a long-standing no-explicit-any backlog that predates this file).
name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Build (static export)
        # next build directly — `npm run build` would run prebuild and bump VERSION
        # on every CI run, which is a release action, not a check.
        run: npx next build
      - name: Lint (report only)
        continue-on-error: true
        run: npm run lint
